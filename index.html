<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Under Construction Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .message {
      padding: 20px;
      background: #222;
      color: white;
      text-align: center;
      flex: 0 0 auto;
    }

    .message a {
      color: #00ffff;
      text-decoration: none;
    }

    #puzzle-container {
      flex: 1 1 auto;
      position: relative;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>This Website is Under Construction</h1>
    <p>Solve the puzzle while we build something awesome!</p>
    <a href="https://www.linkedin.com/in/jahed-murad-sunny/" target="_blank">Visit LinkedIn</a>
  </div>

  <div id="puzzle-container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    let scene = new THREE.Scene();
    let camera = new THREE.OrthographicCamera();
    let renderer = new THREE.WebGLRenderer({antialias: true});
    document.getElementById('puzzle-container').appendChild(renderer.domElement);

    const tileSize = 1;
    const gridSize = 3;
    let empty = {x: 2, y: 2};
    let tiles = [];

    function resizeCamera() {
      const container = document.getElementById('puzzle-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      const aspect = width / height;
      const viewSize = 4;

      camera.left = -viewSize * aspect / 2;
      camera.right = viewSize * aspect / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.near = 0.1;
      camera.far = 100;
      camera.updateProjectionMatrix();
      camera.position.z = 10;

      renderer.setSize(width, height);
    }

    window.addEventListener('resize', resizeCamera);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const loader = new THREE.TextureLoader();
    loader.load('puzzle.png', texture => {
      const tileGeo = new THREE.BoxGeometry(tileSize, tileSize, 0.2);
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (x === 2 && y === 2) continue;
          const canvas = document.createElement('canvas');
          canvas.width = 256; canvas.height = 256;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(
            texture.image,
            x * texture.image.width / gridSize,
            y * texture.image.height / gridSize,
            texture.image.width / gridSize,
            texture.image.height / gridSize,
            0, 0, canvas.width, canvas.height
          );
          const canvasTex = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshStandardMaterial({ map: canvasTex });
          const tile = new THREE.Mesh(tileGeo, mat);
          tile.userData = {x, y, num: y * gridSize + x + 1};
          tile.position.set((x - 1) * tileSize, (1 - y) * tileSize, 0);
          scene.add(tile);
          tiles.push(tile);
        }
      }
      shuffle();
      resizeCamera();
      animate();
    });

    function getAdjacent(x, y) {
      return tiles.filter(t => {
        const dx = Math.abs(t.userData.x - x);
        const dy = Math.abs(t.userData.y - y);
        return dx + dy === 1;
      });
    }

    function shuffle(count = 100) {
      for (let i = 0; i < count; i++) {
        const options = getAdjacent(empty.x, empty.y);
        const tile = options[Math.floor(Math.random() * options.length)];
        move(tile, false);
      }
    }

    function move(tile, checkWin = true) {
      const {x, y} = tile.userData;
      if (Math.abs(x - empty.x) + Math.abs(y - empty.y) === 1) {
        tile.userData.x = empty.x;
        tile.userData.y = empty.y;
        tile.position.set((empty.x - 1) * tileSize, (1 - empty.y) * tileSize, 0);
        empty.x = x;
        empty.y = y;
        if (checkWin && isSolved()) setTimeout(() => alert("🎉 Puzzle Solved!"), 100);
      }
    }

    function isSolved() {
      return tiles.every(t => {
        const correctX = (t.userData.num - 1) % gridSize;
        const correctY = Math.floor((t.userData.num - 1) / gridSize);
        return t.userData.x === correctX && t.userData.y === correctY;
      });
    }

    function handleInteraction(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(tiles);
      if (intersects.length > 0) move(intersects[0].object);
    }

    renderer.domElement.addEventListener('click', e => {
      handleInteraction(e.clientX, e.clientY);
    });

    renderer.domElement.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
