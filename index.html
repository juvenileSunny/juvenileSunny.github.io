<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Under Construction - 3D Puzzle</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #222;
    }
    canvas {
      display: block;
    }
    .message {
      position: absolute;
      top: 10%;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 0 10px #000;
      z-index: 1;
    }
    .message h1 {
      font-size: 3em;
      margin: 0;
    }
    .message p {
      font-size: 1.5em;
    }
    .message a {
      color: #00ffff;
      font-size: 1.2em;
      text-decoration: none;
    }
    .message a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>This Website is Under Construction</h1>
    <p>Enjoy solving the puzzle while we build something amazing!</p>
    <a href="https://www.linkedin.com/in/jahed-murad-sunny/">Visit LinkedIn</a>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let tiles = [];
    let emptyPos = { x: 2, y: 2 };
    const tileSize = 1;
    const gridSize = 3;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 5);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 5;
      controls.maxDistance = 10;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(0, 10, 10);
      scene.add(directionalLight);

      createTiles();
      shuffleTiles();

      window.addEventListener('resize', onWindowResize, false);
      window.addEventListener('click', onMouseClick, false);
    }

    function createTiles() {
      const geometry = new THREE.BoxGeometry(tileSize, tileSize, 0.2);
      const loader = new THREE.TextureLoader();

      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (x === emptyPos.x && y === emptyPos.y) continue;

          const number = y * gridSize + x + 1;
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 128;
          const context = canvas.getContext('2d');
          context.fillStyle = '#00ffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = '#000';
          context.font = 'bold 64px Arial';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(number, canvas.width / 2, canvas.height / 2);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.MeshStandardMaterial({ map: texture });

          const tile = new THREE.Mesh(geometry, material);
          tile.position.set(
            (x - 1) * tileSize,
            (1 - y) * tileSize,
            0
          );
          tile.userData = { x, y, number };
          scene.add(tile);
          tiles.push(tile);
        }
      }
    }

    function shuffleTiles() {
      for (let i = 0; i < 100; i++) {
        const neighbors = getAdjacentTiles(emptyPos.x, emptyPos.y);
        const tile = neighbors[Math.floor(Math.random() * neighbors.length)];
        moveTile(tile);
      }
    }

    function getAdjacentTiles(x, y) {
      return tiles.filter(tile => {
        const dx = Math.abs(tile.userData.x - x);
        const dy = Math.abs(tile.userData.y - y);
        return (dx + dy === 1);
      });
    }

    function onMouseClick(event) {
      event.preventDefault();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(tiles);
      if (intersects.length > 0) {
        const tile = intersects[0].object;
        const dx = Math.abs(tile.userData.x - emptyPos.x);
        const dy = Math.abs(tile.userData.y - emptyPos.y);
        if (dx + dy === 1) {
          moveTile(tile);
          if (checkWin()) {
            setTimeout(() => {
              alert('Congratulations! You solved the puzzle!');
            }, 100);
          }
        }
      }
    }

    function moveTile(tile) {
      const tempX = tile.userData.x;
      const tempY = tile.userData.y;
      tile.userData.x = emptyPos.x;
      tile.userData.y = emptyPos.y;
      tile.position.set(
        (emptyPos.x - 1) * tileSize,
        (1 - emptyPos.y) * tileSize,
        0
      );
      emptyPos.x = tempX;
      emptyPos.y = tempY;
    }

    function checkWin() {
      for (let tile of tiles) {
        const correctX = (tile.userData.number - 1) % gridSize;
        const correctY = Math.floor((tile.userData.number - 1) / gridSize);
        if (tile.userData.x !== correctX || tile.userData.y !== correctY) {
          return false;
        }
      }
      return true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
