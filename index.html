<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Under Construction</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #222;
    }

    canvas {
      display: block;
    }

    .message {
      position: absolute;
      top: 30%;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 0 10px #000;
      z-index: 1;
    }

    .message h1 {
      font-size: 3em;
      margin: 0;
    }

    .message p {
      font-size: 1.5em;
    }

    .message a {
      color: #00ffff;
      font-size: 1.2em;
      text-decoration: none;
    }

    .message a:hover {
      text-decoration: underline;
    }
  </style>
  <!-- Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="message">
    <h1>This Website is Under Construction</h1>
    <p>Please refer to my linked page for more information.</p>
    <a href="https://www.linkedin.com/in/jahed-murad-sunny/">Visit LinkedIn</a>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 2, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7.5);
    scene.add(directionalLight);

    // Building Facade
    const buildingGeometry = new THREE.BoxGeometry(6, 8, 1);
    const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
    building.position.y = 4;
    scene.add(building);

    // Crane Base
    const craneBaseGeometry = new THREE.CylinderGeometry(0.2, 0.2, 2, 32);
    const craneBaseMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
    const craneBase = new THREE.Mesh(craneBaseGeometry, craneBaseMaterial);
    craneBase.position.set(-3, 1, 0);
    scene.add(craneBase);

    // Crane Arm
    const craneArmGeometry = new THREE.BoxGeometry(4, 0.2, 0.2);
    const craneArmMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
    const craneArm = new THREE.Mesh(craneArmGeometry, craneArmMaterial);
    craneArm.position.set(-1, 2, 0);
    scene.add(craneArm);

    // Construction Cones
    const coneGeometry = new THREE.ConeGeometry(0.3, 0.6, 32);
    const coneMaterial = new THREE.MeshStandardMaterial({ color: 0xffa500 });

    for (let i = -2; i <= 2; i++) {
      const cone = new THREE.Mesh(coneGeometry, coneMaterial);
      cone.position.set(i * 1.5, 0.3, 2);
      scene.add(cone);
    }

    // Animation
    let angle = 0;
    function animate() {
      requestAnimationFrame(animate);
      angle += 0.01;
      craneArm.rotation.z = Math.sin(angle) * 0.2;
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Design
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
