<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>I am Ironman!!!</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    .message {
      position: absolute;
      top: 10%;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 1;
      pointer-events: none;
    }
    .message a {
      color: #00ffff;
      font-size: 1.2em;
      text-decoration: none;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>This Website is Under Construction</h1>
    <p>Solve the image puzzle while we build something awesome!</p>
    <a href="https://www.linkedin.com/in/jahed-murad-sunny/" target="_blank">Visit LinkedIn</a>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    let renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const tileSize = 1;
    const gridSize = 3;
    let empty = {x: 2, y: 2};
    let tiles = [];

    camera.position.z = 5;
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    let light = new THREE.PointLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    const loader = new THREE.TextureLoader();
    loader.load('puzzle.png', texture => {
      const tileGeo = new THREE.BoxGeometry(tileSize, tileSize, 0.2);
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (x === 2 && y === 2) continue;

          const canvas = document.createElement('canvas');
          canvas.width = 256; canvas.height = 256;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(
            texture.image,
            x * (texture.image.width / gridSize),
            y * (texture.image.height / gridSize),
            texture.image.width / gridSize,
            texture.image.height / gridSize,
            0, 0, canvas.width, canvas.height
          );

          const canvasTex = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshStandardMaterial({ map: canvasTex });
          const tile = new THREE.Mesh(tileGeo, mat);
          tile.userData = {x, y, num: y * gridSize + x + 1};
          tile.position.set((x - 1) * tileSize, (1 - y) * tileSize, 0);
          scene.add(tile);
          tiles.push(tile);
        }
      }

      shuffle();
      animate();
    });

    function getAdjacent(x, y) {
      return tiles.filter(t => {
        let dx = Math.abs(t.userData.x - x);
        let dy = Math.abs(t.userData.y - y);
        return (dx + dy === 1);
      });
    }

    function shuffle(count = 100) {
      for (let i = 0; i < count; i++) {
        let options = getAdjacent(empty.x, empty.y);
        let tile = options[Math.floor(Math.random() * options.length)];
        move(tile, false);
      }
    }

    function move(tile, checkWin = true) {
      let {x, y} = tile.userData;
      if (Math.abs(x - empty.x) + Math.abs(y - empty.y) === 1) {
        tile.userData.x = empty.x;
        tile.userData.y = empty.y;
        tile.position.set((empty.x - 1) * tileSize, (1 - empty.y) * tileSize, 0);
        empty.x = x;
        empty.y = y;
        if (checkWin && isSolved()) setTimeout(() => alert("🎉 Puzzle Solved!"), 100);
      }
    }

    function isSolved() {
      return tiles.every(t => {
        let correctX = (t.userData.num - 1) % gridSize;
        let correctY = Math.floor((t.userData.num - 1) / gridSize);
        return t.userData.x === correctX && t.userData.y === correctY;
      });
    }

    window.addEventListener('click', (e) => {
      let mouse = new THREE.Vector2(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
      );
      let raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      let intersects = raycaster.intersectObjects(tiles);
      if (intersects.length > 0) move(intersects[0].object);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
