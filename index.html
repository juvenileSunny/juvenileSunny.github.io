<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MJM Sunny</title>

  <link rel="icon" type="image/png" href="static/cute-robot-companion-glb/augmented-reality.png">
  <link rel="apple-touch-icon" href="static/cute-robot-companion-glb/augmented-reality.png">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
  <!-- Background -->
  <div class="background">
    <img class="image-gradient" src="gradient.png" alt="gradient background" />
    <div class="layer-blur"></div>
  </div>

  <!-- Header -->
  <div class="container">
    <header>
      <h1 class="logo">MJM Sunny</h1>
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#academics">Academics</a>
        <a href="#experience">Experience</a>
        <a href="#achievements">Achievements</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#" class="btn-primary" id="playGame">Play Game</a>
    </header>

    <!-- 🧠 Home Section (Always visible) -->
    <main id="home">
      

      <!-- Placeholder for loaded sections -->
      <div id="content"></div>
    </main>
  </div>

  <!-- Puzzle Modal -->
  <div id="puzzleModal" class="puzzle-modal">
    <div class="puzzle-content">
      <span id="closePuzzle" class="close">&times;</span>
      <h2>Iron Man Puzzle Game</h2>
      <canvas id="puzzleCanvas" width="420" height="418"></canvas>
      <p id="moves">Moves: 0</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="scripts/model-viewer.js"></script>
  <script src="scripts/puzzle-game.js"></script>
  <script src="scripts/header-effects.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
